plugins { id 'com.android.application' version '8.11.1' }

android {
    namespace 'nl.lrvdlinden.bingrtrack'
    compileSdk 35
    defaultConfig {
        applicationId 'nl.lrvdlinden.bingrtrack'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
        resValue 'string', 'bingr_url', System.getenv('BINGR_SUPABASE_URL') ?: ''
        resValue 'string', 'bingr_key', System.getenv('BINGR_SUPABASE_PUBLISHABLE_KEY') ?: ''
        resValue 'string', 'trakt_id', System.getenv('TRACK_TRAKT_CLIENT_ID') ?: ''
    }
    sourceSets { main { assets.srcDirs = ['../../web'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
