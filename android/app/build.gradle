plugins { id 'com.android.application' version '8.11.1' }

def trackVersion = new Properties()
rootProject.file('../TrackVersion.xcconfig').withInputStream { trackVersion.load(it) }

android {
    namespace 'nl.lrvdlinden.bingrtrack'
    compileSdk 35
    defaultConfig {
        applicationId 'nl.lrvdlinden.bingrtrack'
        minSdk 26
        targetSdk 35
        versionCode trackVersion.getProperty('TRACK_BUILD').toInteger()
        versionName trackVersion.getProperty('TRACK_VERSION')
        resValue 'string', 'bingr_url', System.getenv('BINGR_SUPABASE_URL') ?: 'https://vjewsncmsxmhmhnoxwqx.supabase.co'
        resValue 'string', 'bingr_key', System.getenv('BINGR_SUPABASE_PUBLISHABLE_KEY') ?: 'sb_publishable_lpIup6Omq5kW2k3oICGZ4g_HPGac5A3'
        resValue 'string', 'trakt_id', System.getenv('TRACK_TRAKT_CLIENT_ID') ?: ''
    }
    sourceSets { main { assets.srcDirs = ['../../web'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
