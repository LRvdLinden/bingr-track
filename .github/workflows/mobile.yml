name: Mobile builds
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BINGR_SUPABASE_URL: ${{ vars.BINGR_SUPABASE_URL }}
  BINGR_SUPABASE_PUBLISHABLE_KEY: ${{ vars.BINGR_SUPABASE_PUBLISHABLE_KEY }}
  TRACK_TRAKT_CLIENT_ID: ${{ vars.TRACK_TRAKT_CLIENT_ID }}

jobs:
  wordmark:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Render the Bingr iOS wordmark
        run: |
          swiftc -parse-as-library tools/RenderBingrWordmark.swift -o "$RUNNER_TEMP/render-wordmark"
          "$RUNNER_TEMP/render-wordmark" web/bingr-wordmark.png
      - uses: actions/upload-artifact@v4
        with:
          name: Bingr-wordmark
          path: web/bingr-wordmark.png
  apple:
    needs: wordmark
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Bingr-wordmark
          path: web
      - name: Generate project
        run: |
          brew install xcodegen
          python3 -c 'import os; keys=("BINGR_SUPABASE_URL","BINGR_SUPABASE_PUBLISHABLE_KEY","TRACK_TRAKT_CLIENT_ID"); print("\n".join(k + " = " + os.environ[k].replace("://", ":$(BINGR_URL_SLASH)$(BINGR_URL_SLASH)") for k in keys if os.environ.get(k)))' > Config.local.xcconfig
          xcodegen generate
      - name: Archive iOS and iPadOS
        run: xcodebuild -project BingrTrack.xcodeproj -scheme BingrTrack -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/BingrTrack.xcarchive" CODE_SIGNING_ALLOWED=NO archive -quiet
      - name: Verify Apple archive configuration and shared interface
        run: |
          plist="$RUNNER_TEMP/BingrTrack.xcarchive/Products/Applications/BingrTrack.app/Info.plist"
          python3 - "$plist" <<'PY'
          import plistlib
          import sys

          with open(sys.argv[1], "rb") as file:
              info = plistlib.load(file)
          required = {"UIInterfaceOrientation" + suffix for suffix in
                      ("Portrait", "PortraitUpsideDown", "LandscapeLeft", "LandscapeRight")}
          declared = set(info.get("UISupportedInterfaceOrientations", []))
          ipad = set(info.get("UISupportedInterfaceOrientations~ipad", declared))
          if not required <= declared or not required <= ipad or 2 not in info.get("UIDeviceFamily", []):
              raise SystemExit("The Apple archive must declare all four orientations for iPad multitasking.")
          PY
          diff -r web "$(dirname "$plist")/web"
          version=$(awk '$1 == "TRACK_VERSION" {print $3}' TrackVersion.xcconfig)
          build=$(awk '$1 == "TRACK_BUILD" {print $3}' TrackVersion.xcconfig)
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" == "$version" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" == "$build" ]]
          value=$(/usr/libexec/PlistBuddy -c 'Print :BingrURL' "$plist")
          [[ "$value" =~ ^https://[a-zA-Z0-9.-]+/?$ ]]
          /usr/libexec/PlistBuddy -c 'Print :BingrPublishableKey' "$plist" | grep -qE '^(sb_publishable_|eyJ)'
      - name: Package Xcode project
        run: zip -rq Bingr-Track-Xcode.zip BingrTrack.xcodeproj Apple web Info.plist project.yml TrackVersion.xcconfig Config.xcconfig Config.local.xcconfig README.md tools/RenderBingrWordmark.swift
      - uses: actions/upload-artifact@v4
        with:
          name: Bingr-Track-Xcode
          path: Bingr-Track-Xcode.zip
  android:
    needs: wordmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Bingr-wordmark
          path: web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check Android SDK
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ ! -f "$sdk/platforms/android-35/android.jar" ] || [ ! -d "$sdk/build-tools/35.0.0" ]; then
            manager=$(find "$sdk/cmdline-tools" -path '*/bin/sdkmanager' -print -quit)
            "$manager" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile installable APK
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Sign with the fixed Bingr Track key
        env:
          APK_KEY: ${{ secrets.APK_KEY }}
          APK_KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
          APK_KEY_ALIAS: ${{ vars.APK_KEY_ALIAS }}
          APK_CERT_SHA256: ${{ vars.APK_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$APK_KEY" ] || [ -z "$APK_KEYSTORE_PASSWORD" ]; then
            echo "::error::Configure APK_KEY (Base64 keystore) and APK_KEYSTORE_PASSWORD in Bingr Track repository secrets."
            exit 1
          fi
          umask 077
          keystore=$(mktemp "${RUNNER_TEMP}/bingr-track-key.XXXXXX")
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$APK_KEY" | base64 --decode > "$keystore"
          export APK_KEY_PASSWORD="${APK_KEY_PASSWORD:-$APK_KEYSTORE_PASSWORD}"
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$sdk/build-tools/35.0.0/apksigner"
          format=$(od -An -tx1 -N4 "$keystore" | tr -d ' \n')
          case "$format" in
            feedfeed) type=JKS ;;
            30*) type=PKCS12 ;;
            *) echo "::error::APK_KEY is not a Base64-encoded JKS or PKCS12 keystore."; exit 1 ;;
          esac
          if ! keytool -list -keystore "$keystore" -storetype "$type" -storepass:env APK_KEYSTORE_PASSWORD >/dev/null 2>&1; then
            echo "::error::The keystore could not be opened with APK_KEYSTORE_PASSWORD."
            exit 1
          fi
          args=(--ks "$keystore" --ks-type "$type" --ks-pass env:APK_KEYSTORE_PASSWORD --key-pass env:APK_KEY_PASSWORD)
          if [ -n "$APK_KEY_ALIAS" ]; then args+=(--ks-key-alias "$APK_KEY_ALIAS"); fi
          "$apksigner" sign "${args[@]}" --out Bingr-Track-Android.apk android/app/build/outputs/apk/debug/app-debug.apk
          certificates=$("$apksigner" verify --print-certs Bingr-Track-Android.apk)
          fingerprint=$(awk -F ': ' '$1 == "Signer #1 certificate SHA-256 digest" {print tolower($2)}' <<< "$certificates")
          [[ "$fingerprint" =~ ^[0-9a-f]{64}$ ]]
          if [ -n "$APK_CERT_SHA256" ]; then
            expected=${APK_CERT_SHA256//:/}
            if [ "$fingerprint" != "${expected,,}" ]; then
              echo "::error::Android signing certificate differs from APK_CERT_SHA256."
              exit 1
            fi
          fi
          printf 'Bingr Track Android certificate SHA-256: %s\n' "$fingerprint"
      - name: Verify Android version and shared interface
        run: |
          version=$(awk '$1 == "TRACK_VERSION" {print $3}' TrackVersion.xcconfig)
          build=$(awk '$1 == "TRACK_BUILD" {print $3}' TrackVersion.xcconfig)
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          info=$("$sdk/build-tools/35.0.0/aapt" dump badging Bingr-Track-Android.apk)
          [[ "$info" == *"versionCode='$build' versionName='$version'"* ]]
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          web = Path("web")
          expected = {f"assets/{path.relative_to(web)}": path.read_bytes()
                      for path in web.rglob("*") if path.is_file()}
          with ZipFile("Bingr-Track-Android.apk") as apk:
              actual = {name: apk.read(name) for name in apk.namelist()
                        if name.startswith("assets/") and not name.endswith("/")}
          if actual != expected:
              raise SystemExit("The APK does not contain the exact shared web assets.")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Bingr-Track-Android
          path: Bingr-Track-Android.apk
