name: Xcode-project

# Maakt het gegenereerde BingrTrack.xcodeproj (XcodeGen) met de Info.plist- en entitlements-bestanden die niet in git staan,
# voor een Xcode-zip die buiten GitHub wordt samengesteld. Zelfde werkwijze als in Bingr: het resultaat gaat alleen
# VERSLEUTELD mee (als annotaties), met een willekeurige AES-sleutel die met de meegegeven publieke RSA-sleutel is
# ingepakt. Zonder de bijbehorende private sleutel is het onleesbaar.
on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: "Publieke RSA-sleutel (PEM, base64)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  xcodeproj:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Project genereren
        env:
          BINGR_SUPABASE_URL: ${{ vars.BINGR_SUPABASE_URL }}
          BINGR_SUPABASE_PUBLISHABLE_KEY: ${{ vars.BINGR_SUPABASE_PUBLISHABLE_KEY }}
          TRACK_TRAKT_CLIENT_ID: ${{ vars.TRACK_TRAKT_CLIENT_ID }}
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          swiftc -parse-as-library tools/RenderBingrWordmark.swift -o "$RUNNER_TEMP/render-wordmark"
          "$RUNNER_TEMP/render-wordmark" web/bingr-wordmark.png
          xcodegen generate
      - name: Versleutelen
        env:
          PUBKEY: ${{ inputs.pubkey }}
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/out"; mkdir -p "$O"
          printf '%s' "$PUBKEY" | base64 -d > "$RUNNER_TEMP/pub.pem"
          # alles wat XcodeGen maakt (niet in git): het .xcodeproj, de plist-/entitlements-bestanden en de wordmark-PNG
          { echo BingrTrack.xcodeproj; git ls-files --others | grep -E '\.(plist|entitlements)$'; echo web/bingr-wordmark.png; } > "$RUNNER_TEMP/files"
          cat "$RUNNER_TEMP/files"
          tar -cJf "$RUNNER_TEMP/proj.tgz" -T "$RUNNER_TEMP/files"
          openssl rand -out "$RUNNER_TEMP/k" 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$RUNNER_TEMP/proj.tgz" -out "$O/proj.tgz.enc" -pass file:"$RUNNER_TEMP/k"
          openssl pkeyutl -encrypt -pubin -inkey "$RUNNER_TEMP/pub.pem" -pkeyopt rsa_padding_mode:oaep -in "$RUNNER_TEMP/k" -out "$O/key.enc"
          git rev-parse HEAD > "$O/commit.txt"
          rm -f "$RUNNER_TEMP/k" "$RUNNER_TEMP/proj.tgz"
      # Artefacten zijn niet op te halen vanaf de plek waar de zip wordt samengesteld: het versleutelde resultaat gaat in
      # stukjes als annotaties mee (base64, 4000 tekens per stuk, max. 9 per stap, 5 stappen).
      - name: Versleuteld resultaat in stukken
        run: |
          set -euo pipefail
          O="$RUNNER_TEMP/out"
          { base64 < "$O/proj.tgz.enc" | tr -d '\n' | fold -w 4000; echo; } | grep -v '^$' > "$RUNNER_TEMP/chunks"
          n=$(wc -l < "$RUNNER_TEMP/chunks")
          [ "$n" -le 45 ] || { echo "::error::te groot voor annotaties ($n stukken)"; exit 1; }
          echo "::notice title=xcp-key::$(base64 < "$O/key.enc" | tr -d '\n')"
          echo "::notice title=xcp-commit::$(cat "$O/commit.txt")"
          echo "::notice title=xcp-count::$n"
      - name: Stukken 1-9
        run: |
          i=0; while IFS= read -r line; do i=$((i+1)); if [ $i -ge 1 ] && [ $i -le 9 ]; then echo "::notice title=xcp-$i::$line"; fi; done < "$RUNNER_TEMP/chunks"
      - name: Stukken 10-18
        run: |
          i=0; while IFS= read -r line; do i=$((i+1)); if [ $i -ge 10 ] && [ $i -le 18 ]; then echo "::notice title=xcp-$i::$line"; fi; done < "$RUNNER_TEMP/chunks"
      - name: Stukken 19-27
        run: |
          i=0; while IFS= read -r line; do i=$((i+1)); if [ $i -ge 19 ] && [ $i -le 27 ]; then echo "::notice title=xcp-$i::$line"; fi; done < "$RUNNER_TEMP/chunks"
      - name: Stukken 28-36
        run: |
          i=0; while IFS= read -r line; do i=$((i+1)); if [ $i -ge 28 ] && [ $i -le 36 ]; then echo "::notice title=xcp-$i::$line"; fi; done < "$RUNNER_TEMP/chunks"
      - name: Stukken 37-45
        run: |
          i=0; while IFS= read -r line; do i=$((i+1)); if [ $i -ge 37 ] && [ $i -le 45 ]; then echo "::notice title=xcp-$i::$line"; fi; done < "$RUNNER_TEMP/chunks"
