name: BingrTrack
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
targets:
  BingrTrack:
    type: application
    platform: iOS
    sources:
      - Apple
      - path: web
        type: folder
        buildPhase: resources
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: nl.lrvdlinden.bingrtrack
        MARKETING_VERSION: $(TRACK_VERSION)
        CURRENT_PROJECT_VERSION: $(TRACK_BUILD)
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Bingr Track
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSFaceIDUsageDescription: Gebruik Face ID om Bingr Track te ontgrendelen.
        BingrURL: $(BINGR_SUPABASE_URL)
        BingrPublishableKey: $(BINGR_SUPABASE_PUBLISHABLE_KEY)
        TraktClientID: $(TRACK_TRAKT_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: nl.lrvdlinden.bingrtrack.oauth
            CFBundleURLSchemes: [bingrtrack]
